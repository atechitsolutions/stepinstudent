<!doctype html>
<html lang="en">
<head>
    <!-- =========================================================
         BASIC DOCUMENT / TECHNICAL SEO
         ========================================================= -->
    <meta charset="UTF-8" />

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0B1020" />

    <meta name="robots" content="index, follow" />

    <meta
            name="description"
            content="A-Tech provides website development, web applications, e-commerce, custom software, CRM, mobile applications, SEO, digital marketing, UI/UX design, API and backend solutions for businesses."
    />

    <title>
        A-Tech | Website Development & Digital Solutions
    </title>

    <!-- Canonical URL -->
    <!-- Replace YOUR-DOMAIN.com with the real production domain later -->
    <link
            rel="canonical"
            href="https://YOUR-DOMAIN.com/"
    />

    <!-- =========================================================
         OPEN GRAPH
         ========================================================= -->
    <meta property="og:type" content="website" />

    <meta
            property="og:title"
            content="A-Tech | Website Development & Digital Solutions"
    />

    <meta
            property="og:description"
            content="Technology solutions built around your business — website development, web applications, e-commerce, custom software, mobile apps, SEO and digital marketing."
    />

    <meta
            property="og:url"
            content="https://YOUR-DOMAIN.com/"
    />

    <meta
            property="og:site_name"
            content="A-Tech"
    />

    <meta
            property="og:image"
            content="https://YOUR-DOMAIN.com/images/og-image.jpg"
    />

    <meta
            property="og:image:alt"
            content="A-Tech — Technology and Digital Solutions"
    />

    <!-- =========================================================
         TWITTER / X
         ========================================================= -->
    <meta
            name="twitter:card"
            content="summary_large_image"
    />

    <meta
            name="twitter:title"
            content="A-Tech | Website Development & Digital Solutions"
    />

    <meta
            name="twitter:description"
            content="Technology solutions built around your business — websites, web applications, e-commerce, custom software, mobile apps, SEO and digital marketing."
    />

    <meta
            name="twitter:image"
            content="https://YOUR-DOMAIN.com/images/og-image.jpg"
    />

    <meta
            name="twitter:image:alt"
            content="A-Tech — Technology and Digital Solutions"
    />

    <!-- =========================================================
         FAVICON
         ========================================================= -->
    <!-- Keep your existing favicon filename if you already have one. -->
    <link
            rel="icon"
            type="image/png"
            href="/favicon.png"
    />

    <!-- Optional SVG favicon if you have one -->
    <!--
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    -->

    <!-- =========================================================
         FONT PERFORMANCE
         ========================================================= -->
    <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
    />

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
    />

    <!-- =========================================================
         ORGANIZATION STRUCTURED DATA
         ========================================================= -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "A-Tech",
            "description": "Technology and digital solutions company providing website development, web applications, e-commerce, custom software, CRM, mobile applications, SEO, digital marketing, UI/UX design, API and backend solutions.",
            "url": "https://YOUR-DOMAIN.com/",
            "logo": "https://YOUR-DOMAIN.com/images/logo.png"
        }
    </script>

    <!-- =========================================================
         WEBSITE STRUCTURED DATA
         ========================================================= -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "A-Tech",
            "url": "https://YOUR-DOMAIN.com/",
            "description": "Technology and digital solutions for businesses."
        }
    </script>
</head>

<body>
<div id="root"></div>

<script
        type="module"
        src="/src/main.jsx"
></script>
</body>
</html>
